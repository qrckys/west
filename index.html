<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MARK WEST AR</title>

  <link rel="preload" href="https://qrckys.github.io/west/westwing.glb" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="https://qrckys.github.io/west/westwing2.glb" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="https://qrckys.github.io/west/westwing.mp3" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="https://qrckys.github.io/west/westwing2.mp3" as="fetch" crossorigin="anonymous">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body.ar-active { background: transparent !important; }
    a-scene { background: transparent !important; }

    /* ── SAFARI BANNER ── */
    #safari-banner {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; color: #fff; flex-direction: column; justify-content: center;
      align-items: center; z-index: 99999; font-family: sans-serif; text-align: center;
      padding: 40px; box-sizing: border-box;
    }
    #open-safari-btn {
      margin-top: 30px; padding: 16px 36px; font-size: 14px; background: #fff;
      color: #000; border: none; border-radius: 4px; font-weight: bold; text-transform: uppercase;
    }

    /* ── UI OVERLAY ── */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; color: white; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999;
      font-family: sans-serif; text-align: center;
    }
    #start-btn {
      padding: 18px 40px; font-size: 18px; background: #28a745; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    #marker-preview { width: 150px; border: 1px solid #444; margin-bottom: 25px; opacity: 0.8; }
    #progress-container { width: 240px; height: 4px; background: #222; margin-top: 20px; display: none; overflow: hidden; }
    #progress-bar { width: 0%; height: 100%; background: #28a745; transition: width 0.3s ease; }
    #progress-text { font-size: 10px; margin-top: 15px; color: #666; display: none; letter-spacing: 2px; }

    /* ── SCAN UI ── */
    #scan-reticle {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 200px; height: 200px; z-index: 1000; display: none; pointer-events: none;
    }
    .corner { position: absolute; width: 28px; height: 28px; border-color: #fff; border-style: solid; opacity: 0.8; }
    .tl { top: 0; left: 0; border-width: 3px 0 0 3px; }
    .tr { top: 0; right: 0; border-width: 3px 3px 0 0; }
    .bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
    .br { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
    #scan-hint {
      position: fixed; bottom: 120px; width: 100%; text-align: center; color: #fff;
      font-family: sans-serif; font-size: 11px; letter-spacing: 2px; z-index: 1000; display: none;
    }
    #ui-controls {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      display: none; gap: 15px; z-index: 1000;
    }
    .black-btn {
      padding: 15px 25px; background: #000; color: #fff; text-decoration: none;
      border: 1px solid #444; border-radius: 4px; font-size: 11px; font-weight: bold;
    }
  </style>

  <script>
    // Smooth movement component
    AFRAME.registerComponent('smooth-lerp', {
      init() {
        this.smoothPos = new THREE.Vector3();
        this.smoothQuat = new THREE.Quaternion();
        this.initialized = false;
        this.active = false;
        this.el.addEventListener('targetFound', () => { this.active = true; });
        this.el.addEventListener('targetLost', () => { this.active = false; this.initialized = false; });
      },
      tick() {
        if (!this.active) return;
        const obj = this.el.object3D;
        if (!this.initialized) {
          this.smoothPos.copy(obj.position);
          this.smoothQuat.copy(obj.quaternion);
          this.initialized = true;
          return;
        }
        this.smoothPos.lerp(obj.position, 0.15);
        this.smoothQuat.slerp(obj.quaternion, 0.15);
        obj.position.copy(this.smoothPos);
        obj.quaternion.copy(this.smoothQuat);
      }
    });
  </script>
</head>
<body>

  <div id="safari-banner">
    <h2>OPEN IN SAFARI</h2>
    <p>Audio requires Safari on iOS devices.</p>
    <button id="open-safari-btn">Open in Safari</button>
  </div>

  <div id="scan-reticle">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div id="scan-hint">Point camera at artwork</div>

  <div id="overlay">
    <h1 style="letter-spacing: 5px; font-weight: 300;">MARK WEST</h1>
    <img src="https://qrckys.github.io/west/westwing.jpg" id="marker-preview">
    <button id="start-btn">Enter Experience</button>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <p id="progress-text">Initializing...</p>
  </div>

  <div id="ui-controls">
    <a href="https://www.instagram.com/houseofmarkwest" target="_blank" class="black-btn">Instagram</a>
    <a href="https://markanthonywest.com/" target="_blank" class="black-btn">Get Prints</a>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: https://qrckys.github.io/west/targets.mind; autoStart: false; uiScanning: false; uiLoading: false; maxTrack: 2;"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="sculpture0" src="https://qrckys.github.io/west/westwing.glb"></a-asset-item>
      <a-asset-item id="sculpture1" src="https://qrckys.github.io/west/westwing2.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" intensity="1.2"></a-light>

    <a-entity mindar-image-target="targetIndex: 0" smooth-lerp id="target-0">
      <a-gltf-model src="#sculpture0" scale=".6 .6 .6" animation-mixer></a-gltf-model>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1" smooth-lerp id="target-1">
      <a-gltf-model src="#sculpture1" scale=".6 .6 .6" animation-mixer></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    // ── AUDIO SYSTEM ──
    var AUDIO_URLS = [
      'https://qrckys.github.io/west/westwing.mp3',
      'https://qrckys.github.io/west/westwing2.mp3'
    ];

    // Create audio elements without touching them yet
    var audioEls = AUDIO_URLS.map(function(url) {
      var el = new Audio();
      el.crossOrigin = "anonymous";
      el.src = url;
      el.loop = true;
      el.preload = 'auto';
      el.setAttribute('playsinline', '');
      el.setAttribute('webkit-playsinline', '');
      return el;
    });

    var audioCtx = null;
    var gainNodes = [null, null];
    var isPlaying = [false, false]; // manual play state tracking
    var audioReady = false;

    async function unlockAudio() {
      if (audioCtx) return; // already initialized
      try {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        // Must await resume — iOS requires this after user gesture
        await audioCtx.resume();

        gainNodes = audioEls.map(function(el, i) {
          var g = audioCtx.createGain();
          g.gain.value = 0;
          g.connect(audioCtx.destination);

          // Connecting via createMediaElementSource is enough to "register"
          // the element with the AudioContext. Do NOT play/pause here —
          // that consumes the user gesture and blocks later play() calls on iOS.
          var source = audioCtx.createMediaElementSource(el);
          source.connect(g);

          return g;
        });

        audioReady = true;
        console.log('Audio context ready, state:', audioCtx.state);
      } catch(e) {
        console.warn('Audio setup failed:', e);
      }
    }

    function fadeTrackTo(idx, targetVol) {
      if (!gainNodes[idx] || !audioCtx || !audioReady) return;

      var g = gainNodes[idx];
      var el = audioEls[idx];
      var now = audioCtx.currentTime;

      // Ramp gain
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(targetVol, now + 0.5);

      if (targetVol > 0 && !isPlaying[idx]) {
        // Resume AudioContext in case it suspended (iOS does this)
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().then(() => {
            el.play()
              .then(() => { isPlaying[idx] = true; })
              .catch(e => console.log('Play failed for track ' + idx + ':', e));
          });
        } else {
          el.play()
            .then(() => { isPlaying[idx] = true; })
            .catch(e => console.log('Play failed for track ' + idx + ':', e));
        }
      } else if (targetVol === 0) {
        // Wait for fade to finish before pausing
        setTimeout(function() {
          if (g.gain.value < 0.01) {
            el.pause();
            isPlaying[idx] = false;
          }
        }, 650);
      }
    }

    // ── AR & UI HANDLERS ──
    document.getElementById('start-btn').addEventListener('click', function() {
      // unlockAudio MUST be called synchronously inside the click handler
      // so it runs within the user gesture window
      unlockAudio();

      this.style.display = 'none';
      document.getElementById('progress-container').style.display = 'block';
      document.getElementById('progress-text').style.display = 'block';

      const startAR = () => {
        document.querySelector('a-scene').systems['mindar-image-system'].start();
      };

      if (document.querySelector('a-scene').hasLoaded) {
        startAR();
      } else {
        document.querySelector('a-scene').addEventListener('loaded', startAR, { once: true });
      }
    });

    document.querySelector('a-scene').addEventListener('arReady', () => {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('scan-hint').style.display = 'block';
      document.getElementById('scan-reticle').style.display = 'block';
      document.body.classList.add('ar-active');
    });

    async function onFound(e) {
      var idx = parseInt(e.currentTarget.id.split('-')[1]);

      // Safety: ensure audio is initialized (in case something triggered early)
      if (!audioCtx) {
        await unlockAudio();
      }

      // Resume context if iOS suspended it
      if (audioCtx && audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      document.getElementById('scan-reticle').style.display = 'none';
      document.getElementById('scan-hint').style.display = 'none';
      document.getElementById('ui-controls').style.display = 'flex';

      fadeTrackTo(idx, 1);
    }

    function onLost(e) {
      var idx = parseInt(e.currentTarget.id.split('-')[1]);
      fadeTrackTo(idx, 0);

      // Only show reticle again if no targets are currently visible
      setTimeout(function() {
        var targets = document.querySelectorAll('a-entity[mindar-image-target]');
        var anyVisible = Array.from(targets).some(function(el) {
          return el.getAttribute('visible') === true || el.getAttribute('visible') === 'true';
        });
        if (!anyVisible) {
          document.getElementById('scan-reticle').style.display = 'block';
          document.getElementById('scan-hint').style.display = 'block';
          document.getElementById('ui-controls').style.display = 'none';
        }
      }, 1000);
    }

    document.getElementById('target-0').addEventListener('targetFound', onFound);
    document.getElementById('target-0').addEventListener('targetLost', onLost);
    document.getElementById('target-1').addEventListener('targetFound', onFound);
    document.getElementById('target-1').addEventListener('targetLost', onLost);

    // Safari detection — non-Safari iOS browsers can't access camera / audio properly
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && !/Safari/i.test(navigator.userAgent)) {
      document.getElementById('safari-banner').style.display = 'flex';
      document.getElementById('open-safari-btn').addEventListener('click', function() {
        window.location = 'x-web-search://?q=' + encodeURIComponent(window.location.href);
      });
    }
  </script>
</body>
</html>
